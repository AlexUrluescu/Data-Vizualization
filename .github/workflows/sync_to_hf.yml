name: Sync to Hugging Face hub

on:
  push:
    branches: [refactoring]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Push clean repo to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Delete the bad files so they don't go to Hugging Face
          rm -rf venv
          rm -rf .venv
          rm -rf .idea
          rm -f backend/air_quality.db

          # 2. Wipe the GitHub history inside the runner
          rm -rf .git

          # 3. Initialize a fresh, clean Git repo just for Hugging Face
          git config --global user.email "bot@example.com"
          git config --global user.name "HF Sync Bot"
          git init -b main
          git add .
          git commit -m "Clean deploy to Hugging Face"

          # 4. Force push only this clean commit
          git push --force https://AlexandreUrluescu:$HF_TOKEN@huggingface.co/spaces/AlexandreUrluescu/urban-bike main
